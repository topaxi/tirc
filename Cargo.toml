[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
futures = "0.3"
irc = { version = "1.1", default-features = false, features = [
  "ctcp",
  "tls-native",
  "channel-lists",
] }
tokio = { version = "1.52", features = ["full"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
ratatui = { version = "0.30", features = [
  "crossterm_0_29",
  "serde",
] }
tui-input = { version = "0.15", features = ["crossterm"] }
anyhow = "1.0"
mlua = { version = "0.11", features = ["luajit52", "async", "serialize", "send"] }
xdg = "3.0"
serde = "1.0"
serde_json = "1.0"
log = "0.4"
indoc = "2.0"
indexmap = "2.14"
semver = { version = "1.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
textwrap = "0.16.2"
itertools = "0.14"
unicode-width = "0.2"
async-trait = "0.1.89"
arboard = "3"
open = "5"
# rustls TLS is pulled in unconditionally by matrix-sdk, so dropping default
# features keeps HTTPS working. `e2e-encryption` re-uses the same sqlite store
# for the crypto state (Olm/Megolm keys); `automatic-room-key-forwarding` lets
# our other verified sessions forward us room keys so we can decrypt history.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "webpki-roots",
] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
matrix-sdk = { version = "0.18.0", default-features = false, features = [
  "sqlite",
  "e2e-encryption",
  "automatic-room-key-forwarding",
] }
# The high-level Element X stack (SyncService, RoomListService, Timeline) driving
# the Simplified Sliding Sync path. Pinned to match matrix-sdk exactly.
matrix-sdk-ui = { version = "0.18.0", default-features = false }
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
linkify = "0.11"
scraper = "0.27"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "registry",
  "std",
] }
emojis = "0.9.0"
nucleo-matcher = "0.3.1"
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }
