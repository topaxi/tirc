# Lightweight local Matrix homeservers for tirc development and testing.
#
# Two homeservers are provided so both sync drivers can be exercised:
#
#   * `homeserver` (Conduit, port 6167) does NOT implement Simplified Sliding
#     Sync (MSC4186), so tirc talks to it with the classic `/sync` driver.
#   * `homeserver-sss` (continuwuity, port 6168) advertises
#     `org.matrix.simplified_msc3575`, so tirc auto-selects the sliding-sync
#     driver against it. Force it either way with the `sliding_sync` server
#     option ('on' / 'off' / 'auto').
#
# Both are single-binary homeservers that start quickly and support unencrypted
# and E2E-encrypted rooms (encryption is client-side; the homeserver only relays
# ciphertext). Open registration is enabled for convenience - these are
# throwaway local instances, never expose them.
#
#   docker compose -f dev/matrix/docker-compose.yml up -d
#
# `alice` (matching dev.lua) is registered on Conduit automatically, by the
# `register` service below (see register.sh). continuwuity has no equivalent -
# its first account needs one manual step, since it gates it behind a random
# one-time token printed to `docker logs tirc-homeserver-sss` (see README.md
# for the exact command). Use register.sh yourself for any additional
# accounts on either homeserver:
#
#   ./dev/matrix/register.sh bob bobpassword                            # Conduit
#   HOMESERVER=http://localhost:6168 ./dev/matrix/register.sh bob bobpassword  # continuwuity
#
# Then point an init.lua Matrix server entry at the chosen homeserver with
# user_id '@alice:localhost'.

services:
  homeserver:
    # Fully-qualified so it also resolves under podman (no unqualified search).
    image: docker.io/matrixconduit/matrix-conduit:latest
    # Fixed name so `docker logs`/`docker exec` work the same whether this was
    # started standalone or via the root docker-compose.yml (which uses a
    # different compose project name, so `docker compose logs` wouldn't find
    # containers started the other way, but `docker logs <name>` always will).
    container_name: tirc-homeserver
    restart: unless-stopped
    ports:
      - "6167:6167"
    environment:
      # Empty path = configure purely from CONDUIT_* env vars (no toml file).
      CONDUIT_CONFIG: ""
      CONDUIT_SERVER_NAME: localhost
      # Bind to all interfaces so the mapped port is reachable from the host.
      CONDUIT_ADDRESS: 0.0.0.0
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit/
      CONDUIT_PORT: 6167
      CONDUIT_MAX_REQUEST_SIZE: "20000000"
      CONDUIT_ALLOW_REGISTRATION: "true"
      # Local throwaway instance: permit open registration without a token.
      CONDUIT_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE: "true"
      CONDUIT_ALLOW_FEDERATION: "false"
      CONDUIT_ALLOW_CHECK_FOR_UPDATES: "false"
      CONDUIT_TRUSTED_SERVERS: '["matrix.org"]'
    volumes:
      - conduit_data:/var/lib/matrix-conduit/

  # continuwuity (a maintained conduwuit fork) implements Simplified Sliding
  # Sync, so it is the target for exercising tirc's sliding-sync driver. Its
  # config keys mirror Conduit's, under the CONTINUWUITY_ prefix.
  #
  # Unlike Conduit, continuwuity always gates its *first* account (on a fresh
  # database) behind a random one-time token printed to the container's own
  # logs, regardless of the registration flags below - there is no way to
  # automate that first account non-interactively. (An earlier version of
  # this file tried creating it via `command: conduwuit --execute "users
  # create-user ..."` at boot; that crash-loops instead, because the command
  # is unconditional and fatal on every restart once the account already
  # exists, and `--execute` has no idempotent/"skip if present" form. Do not
  # reintroduce it.) So the first account is a one-time manual step - see
  # README.md - after which the *configured* token (CONTINUWUITY_
  # REGISTRATION_TOKEN, matching register.sh's REGISTRATION_TOKEN) takes over
  # for any additional accounts (e.g. bob) via register.sh, same as Conduit.
  homeserver-sss:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    container_name: tirc-homeserver-sss
    restart: unless-stopped
    ports:
      - "6168:6168"
    environment:
      CONTINUWUITY_SERVER_NAME: localhost
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 6168
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity/
      CONTINUWUITY_MAX_REQUEST_SIZE: "20000000"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: devtoken
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: "false"
    volumes:
      - continuwuity_data:/var/lib/continuwuity/

  # Registers `alice` on Conduit so `docker compose up` alone gets that
  # dev.lua credential working, without a manual register.sh call. (No
  # equivalent is possible for continuwuity's `alice` - see the comment on
  # homeserver-sss above.) One-shot: runs register.sh (which polls Conduit
  # until it's ready, then exits) and stops; `depends_on` here only waits for
  # the container to start, not for it to be ready to accept connections.
  register:
    image: docker.io/library/alpine:3.20
    depends_on:
      - homeserver
    environment:
      HOMESERVER: http://homeserver:6167
    volumes:
      - ./register.sh:/register.sh:ro
    entrypoint: ["sh", "-c"]
    command:
      - apk add --no-cache bash curl >/dev/null && bash /register.sh alice alicepassword

volumes:
  conduit_data:
  continuwuity_data:
