/* Minimal UnrealIRCd 6 config for local tirc development.
 * Throwaway network, open to anyone, never expose this. See ../README.md.
 */

include "modules.default.conf";
include "help/help.conf";
include "badwords.conf";
include "operclass.default.conf";
include "snomasks.default.conf";

loadmodule "cloak_sha256";

me {
	name "irc.localhost";
	info "tirc dev IRC server";
	sid "001";
}

admin {
	"tirc dev";
	"nobody";
	"nobody@localhost";
}

class clients {
	pingfreq 90;
	maxclients 1000;
	sendq 200k;
	recvq 8000;
}

allow {
	mask *;
	class clients;
	maxperip 50;
}

/* Plaintext, for quick testing (use_tls = false in tirc). */
listen {
	ip *;
	port 6667;
}

/* TLS with a throwaway self-signed cert (use_tls = true,
 * accept_invalid_cert = true in tirc).
 */
listen {
	ip *;
	port 6697;
	options { tls; }
}

drpass {
	restart "restart";
	die "die";
}

log {
	source {
		all;
		!debug;
	}
	destination {
		file "ircd.log" { maxsize 100M; }
	}
}

set {
	network-name "tircdev";
	default-server "irc.localhost";
	help-channel "#Help";
	kline-address "nobody@localhost";

	modes-on-connect "+ix";
	modes-on-join "+nt";

	/* Throwaway keys for this dev instance only - never reuse in production. */
	cloak-keys {
		"N7ITxKLUkX0vyOYx6tzSnWQ36xgB0Oz5eGSQw4zzZVZtQb1wMhDp9kY2uRS66MDMqZmJeOHNKXceA9P5";
		"NdRbOmmgsmCV6ZKuaY7NvBKYoJcXJUPt25nNlHHHlXQdVFTVLD5bZHFIWPU7wVJZKPqqeTi8d5ku0fmC";
		"8I1q4dJjBwMT467cBsVjdODwyenwQRPMqTnmiEzNBJqkoT1vzNmZW9N7A7kTENSOucbIMmPBtW89IuXz";
	}
}
