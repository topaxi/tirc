# Lightweight local Matrix homeservers for tirc development and testing.
#
# Two homeservers are provided so both sync drivers can be exercised:
#
#   * `homeserver` (Conduit, port 6167) does NOT implement Simplified Sliding
#     Sync (MSC4186), so tirc talks to it with the classic `/sync` driver.
#   * `homeserver-sss` (continuwuity, port 6168) advertises
#     `org.matrix.simplified_msc3575`, so tirc auto-selects the sliding-sync
#     driver against it. Force it either way with the `sliding_sync` server
#     option ('on' / 'off' / 'auto').
#
# Both are single-binary homeservers that start quickly and support unencrypted
# and E2E-encrypted rooms (encryption is client-side; the homeserver only relays
# ciphertext). Open registration is enabled for convenience - these are
# throwaway local instances, never expose them.
#
#   docker compose -f dev/matrix/docker-compose.yml up -d
#   ./dev/matrix/register.sh alice alicepassword                       # Conduit
#   HOMESERVER=http://localhost:6168 ./dev/matrix/register.sh alice alicepassword  # continuwuity
#
# Then point an init.lua Matrix server entry at the chosen homeserver with
# user_id '@alice:localhost'.

services:
  homeserver:
    # Fully-qualified so it also resolves under podman (no unqualified search).
    image: docker.io/matrixconduit/matrix-conduit:latest
    restart: unless-stopped
    ports:
      - "6167:6167"
    environment:
      # Empty path = configure purely from CONDUIT_* env vars (no toml file).
      CONDUIT_CONFIG: ""
      CONDUIT_SERVER_NAME: localhost
      # Bind to all interfaces so the mapped port is reachable from the host.
      CONDUIT_ADDRESS: 0.0.0.0
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit/
      CONDUIT_PORT: 6167
      CONDUIT_MAX_REQUEST_SIZE: "20000000"
      CONDUIT_ALLOW_REGISTRATION: "true"
      # Local throwaway instance: permit open registration without a token.
      CONDUIT_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE: "true"
      CONDUIT_ALLOW_FEDERATION: "false"
      CONDUIT_ALLOW_CHECK_FOR_UPDATES: "false"
      CONDUIT_TRUSTED_SERVERS: '["matrix.org"]'
    volumes:
      - conduit_data:/var/lib/matrix-conduit/

  # continuwuity (a maintained conduwuit fork) implements Simplified Sliding
  # Sync, so it is the target for exercising tirc's sliding-sync driver. Its
  # config keys mirror Conduit's, under the CONTINUWUITY_ prefix.
  homeserver-sss:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    restart: unless-stopped
    ports:
      - "6168:6168"
    environment:
      CONTINUWUITY_SERVER_NAME: localhost
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 6168
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity/
      CONTINUWUITY_MAX_REQUEST_SIZE: "20000000"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE: "true"
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: "false"
    volumes:
      - continuwuity_data:/var/lib/continuwuity/

volumes:
  conduit_data:
  continuwuity_data:
